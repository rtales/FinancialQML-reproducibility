name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify frozen inputs
        run: make verify
      - name: Run tests
        run: make test
      - name: Recompute published results
        run: make reproduce
      - name: Build and execute container image
        run: |
          docker build --tag financialqml-reproducibility .
          docker run --rm --volume "$PWD/outputs:/release/outputs" financialqml-reproducibility
